name: Build and publish to GitHub Pages

# Site-ul e construit cu Astro; publicăm rezultatul (dist/) pe ramura
# gh-pages, din care servește GitHub Pages.

on:
  push:
    branches: [claude/1x2-casino-sportsbook-frontend-bofc86]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
