name: Publish to GitHub Pages

# Pages serves the gh-pages branch; this mirrors the working branch into
# gh-pages on every push so the live site always matches the latest code.

on:
  push:
    branches: [claude/1x2-casino-sportsbook-frontend-bofc86]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror branch to gh-pages
        run: git push origin HEAD:gh-pages --force
